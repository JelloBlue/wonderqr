<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WonderQR Admin Diagnostic</title>
<style>body{font-family:Arial;padding:20px;max-width:700px;margin:auto}button{padding:12px 18px;font-weight:bold}pre{white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:8px} .ok{color:#047857}.bad{color:#b91c1c}</style>
</head><body>
<h2>WonderQR Admin Diagnostic</h2>
<p>This page checks whether your phone can reach the WonderQR server. It does not display your admin token.</p>
<button id="run">Run diagnostic</button><pre id="out">Ready.</pre>
<script>
const out=document.getElementById('out');
const SUPA='https://smzwucttkyuqzazozcat.supabase.co/functions/v1/admin_api';
const token=(new URLSearchParams(location.search).get('token')||localStorage.getItem('admin_auth_token')||'').trim();
function log(s){out.textContent+=s+'\n';}
async function timed(url,options={},ms=10000){
 const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
 try{const started=performance.now();const r=await fetch(url,{...options,cache:'no-store',signal:c.signal});const text=await r.text();return {ms:Math.round(performance.now()-started),status:r.status,text};}
 catch(e){return {error:e?.name==='AbortError'?'TIMEOUT':String(e)}}
 finally{clearTimeout(t)}
}
document.getElementById('run').onclick=async()=>{
 out.textContent='';
 log('1. Testing Supabase Edge Function reachability...');
 const a=await timed(SUPA+'?v=diagnostic',{},10000);
 log(JSON.stringify(a,null,2));
 if(a.error){log('\nRESULT: The phone/browser cannot complete a GET request to the Supabase function.');return;}
 log('\n2. Testing authenticated GET...');
 if(!token){log('No token found in this page URL or saved browser storage.');return;}
 const b=await timed(SUPA+'?token='+encodeURIComponent(token)+'&v=diagnostic',{'headers':{'Accept':'application/json'}},10000);
 log(JSON.stringify({...b,text:b.text?.replace(/(auth_token|token)=[^&\s]*/gi,'token=[hidden]')},null,2));
 if(b.error){log('\nRESULT: Public reachability works, but authenticated request is hanging/failing.');}
 else if(b.status===200){log('\nRESULT: Authentication endpoint responded successfully.');}
 else{log('\nRESULT: Server responded with an HTTP error.');}
};
</script></body></html>
