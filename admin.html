<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4734"><title>WonderQR Business Admin</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f8f6;color:#173c30}.page{max-width:1100px;margin:auto;padding:18px}.header{background:#fff;border:1px solid #e4ebe7;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.05)}.header h1{margin:0;font-size:1.35rem}.header p{margin:5px 0 0;color:#64746d;font-size:.85rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e4ebe7;border-radius:14px;padding:16px;box-shadow:0 5px 16px rgba(0,0,0,.04)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.secondary{background:#eef4f1;color:#173c30}.section-toggle{cursor:pointer}.mobile-hide{display:none}
@media(max-width:760px){.page{padding:9px}.header{padding:12px;border-radius:12px;margin-bottom:9px}.card{padding:11px;border-radius:11px}.grid{grid-template-columns:1fr;gap:9px}.header h1{font-size:1.15rem}.actions{gap:6px}.btn{padding:8px 9px;font-size:.78rem}#business-info-section,#security-section{display:none}}
</style></head>
<body><main class="page"><header class="header"><h1 id="business-title">WonderQR Business</h1><p>Business Admin Dashboard</p></header>
<section class="grid">
<div class="card" id="review-board-section"><h2>Review Board</h2><div id="stat-qr"></div><canvas id="standee-canvas" style="max-width:100%;height:auto"></canvas><div class="actions"><button id="test-qr-btn" class="btn secondary" disabled>Test QR</button><button id="copy-link-btn" class="btn secondary" disabled>Copy Link</button><button id="download-qr-btn" class="btn secondary" disabled>Download QR</button><button id="download-standee-btn" class="btn secondary" disabled>Download 4×6 Board</button></div></div>
<div class="card" id="feedback-section"><h2>Customer Feedback</h2><div id="feedback-list">Loading…</div></div>
<div class="card" id="settings-section"><h2>Business Settings</h2><div id="review-settings-root"></div></div>
<div class="card" id="business-info-section"><h2>Business Information</h2><div id="business-info-root"></div></div>
<div class="card" id="security-section"><h2>Security</h2><div id="security-root"></div></div>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script type="module" src="js/admin.js?v=16"></script><script src="js/pwa-install.js?v=3"></script><script type="module" src="js/admin-notifications-ui.js?v=11"></script><script type="module" src="js/admin-mobile-ui.js?v=2"></script>
</body></html>
