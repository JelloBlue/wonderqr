<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - WonderQR</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .metric-card { background: #f9fafb; border: 1px solid #e5e7eb; padding: 16px; border-radius: 8px; text-align: center; }
    .metric-num { font-size: 1.8rem; font-weight: bold; color: #4f46e5; }
    
    .rep-form-container { display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 600px) {
      .rep-form-container { flex-direction: row; }
    }
    
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 24px; text-align: left; }
    .data-table th, .data-table td { border: 1px solid #e5e7eb; padding: 10px; vertical-align: middle; }
    .data-table th { background: #f3f4f6; font-weight: 600; }
    
    .action-btn { padding: 6px 10px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
    .btn-copy { background-color: #4f46e5; color: white; }
    .btn-edit { background-color: #059669; color: white; }
    .btn-cancel { background-color: #6b7280; color: white; }
    
    /* Edit Modal Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: white; border-radius: 8px; padding: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 950px; text-align: left;">
    <h2>Super Admin Dashboard</h2>
    <p class="subtitle" id="auth-status">Authenticating...</p>

    <div id="admin-content" class="hidden">
      <!-- High-Level Platform Overview -->
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-num" id="stat-biz">0</div><div>Businesses</div></div>
        <div class="metric-card"><div class="metric-num" id="stat-reps">0</div><div>Sales Reps</div></div>
        <div class="metric-card"><div class="metric-num" id="stat-qr">0</div><div>QR Codes Assigned</div></div>
        <div class="metric-card"><div class="metric-num" id="stat-fb">0</div><div>Private Feedbacks</div></div>
      </div>

      <!-- Add New Sales Rep Section -->
      <div style="background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
        <h4 style="margin-top:0; margin-bottom: 10px;">Create New Sales Rep Token</h4>
        <div class="rep-form-container">
          <input type="text" id="new-rep-name" class="form-input" placeholder="Sales Rep Name" style="flex: 1; margin: 0;">
          <button type="button" id="create-rep-btn" class="action-btn btn-copy" style="padding: 10px 16px; font-size: 0.9rem;">Generate Token</button>
        </div>
      </div>

      <!-- Onboarded Businesses Overview -->
      <h3>Onboarded Businesses</h3>
      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Business</th>
              <th>Owner</th>
              <th>QR Code</th>
              <th>Sales Rep</th>
              <th>Actions / Links</th>
            </tr>
          </thead>
          <tbody id="businesses-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Business Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-top: 0;">Edit Business</h3>
      <form id="edit-biz-form">
        <input type="hidden" id="edit-biz-id">
        
        <label class="form-label">Business Name</label>
        <input type="text" id="edit-biz-name" class="form-input" required>

        <label class="form-label">Owner Name</label>
        <input type="text" id="edit-owner-name" class="form-input" required>

        <label class="form-label">Google Review URL</label>
        <input type="url" id="edit-google-url" class="form-input" required>

        <label class="form-label">WhatsApp Number</label>
        <input type="tel" id="edit-whatsapp" class="form-input">

        <label class="form-label">Phone Number</label>
        <input type="tel" id="edit-phone" class="form-input">

        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
          <button type="button" id="close-modal-btn" class="action-btn btn-cancel">Cancel</button>
          <button type="submit" class="action-btn btn-edit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/superadmin.js"></script>
</body>
</html>
