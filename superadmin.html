<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Super Admin - WonderQR</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="css/style.css"><style>
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}.metric-card{background:#f9fafb;border:1px solid #e5e7eb;padding:16px;border-radius:8px;text-align:center}.metric-num{font-size:1.8rem;font-weight:bold;color:#4f46e5}.rep-form-container{display:flex;flex-direction:column;gap:10px;width:100%}@media(min-width:600px){.rep-form-container{display:grid;grid-template-columns:2fr 1.4fr 1.8fr auto;align-items:center;max-width:900px}.rep-form-container input{width:100%}}.data-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:24px;text-align:left}.data-table th,.data-table td{border:1px solid #e5e7eb;padding:10px;vertical-align:middle}.data-table th{background:#f3f4f6;font-weight:600}.action-btn{padding:6px 10px;font-size:.75rem;border:none;border-radius:4px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}.btn-copy{background:#4f46e5;color:white}.btn-qr{background:#8b5cf6;color:white}.btn-edit{background:#059669;color:white}.btn-cancel{background:#6b7280;color:white}.btn-add{background:#16a34a;color:white;font-size:.85rem;padding:8px 14px}.btn-danger{background:#dc2626;color:#fff}.btn-toggle{color:#fff}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}.modal-card{background:white;border-radius:8px;padding:20px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;box-sizing:border-box}.hidden{display:none!important}.section{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin:12px 0;overflow:hidden}.section>summary{cursor:pointer;list-style:none;padding:16px;font-size:1rem;font-weight:700;color:#374151;background:#f8fafc}.section>summary::-webkit-details-marker{display:none}.section>summary:after{content:'＋';float:right;color:#6b7280}.section[open]>summary:after{content:'−'}.section-body{padding:14px}.section-body h3{margin-top:4px}.search-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:8px;margin-bottom:10px}.search-wrap{position:relative}.smart-search{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:.9rem;outline:none}.smart-search:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}.suggestions{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #dbe3ec;border-radius:9px;box-shadow:0 10px 24px rgba(0,0,0,.14);z-index:30;overflow:hidden;display:none;max-height:320px;overflow-y:auto}.suggestions.show{display:block}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;border-bottom:1px solid #eef2f7;cursor:pointer}.suggestion:hover{background:#f8fafc}.suggestion-title{font-weight:700;color:#1f2937}.suggestion-meta{font-size:.74rem;color:#64748b;margin-top:2px}.toolbar-select{border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:.82rem;background:#fff}.result-meta{font-size:.78rem;color:#64748b;margin:7px 0 10px}.mobile-cards{display:none}.record-card{border:1px solid #e2e8f0;border-radius:12px;background:#fff;margin-bottom:9px;overflow:hidden}.record-card summary{list-style:none;cursor:pointer;padding:13px}.record-card summary::-webkit-details-marker{display:none}.record-card summary:after{content:'＋';float:right;color:#64748b}.record-card[open] summary:after{content:'−'}.record-main{padding-right:18px}.record-title{font-weight:800;color:#1f2937;font-size:.94rem}.record-sub{font-size:.76rem;color:#64748b;margin-top:3px}.record-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:.68rem;font-weight:700;background:#f1f5f9;color:#475569}.badge.active{background:#dcfce7;color:#166534}.badge.inactive{background:#fee2e2;color:#991b1b}.record-details{padding:0 13px 13px;border-top:1px solid #eef2f7}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.detail-item{background:#f8fafc;border-radius:8px;padding:8px}.detail-item small{display:block;color:#64748b;font-size:.66rem}.detail-item strong{display:block;margin-top:2px;font-size:.78rem;word-break:break-word}.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pagination{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;margin:12px 0 4px}.page-btn{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:7px 10px;font-size:.76rem;cursor:pointer}.page-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}.page-btn:disabled{opacity:.45;cursor:not-allowed}.page-info{font-size:.74rem;color:#64748b;margin:0 8px}.empty-state{text-align:center;padding:22px 10px;color:#64748b;background:#f8fafc;border-radius:9px}
/* Keep the super-admin surface focused: management and analytics only. */
#admin-content>.section:first-child{display:none}
#businesses-tbody [data-copy],#businesses-tbody [data-qr],#businesses-tbody [data-clear-test],#business-mobile-cards [data-copy],#business-mobile-cards [data-qr],#business-mobile-cards [data-clear-test]{display:none!important}
#businesses-tbody th:nth-child(2),#businesses-tbody td:nth-child(2),#businesses-tbody th:nth-child(3),#businesses-tbody td:nth-child(3){display:none}
#businesses-tbody th:nth-child(4){width:18%}#businesses-tbody th:nth-child(5){width:22%}#businesses-tbody th:nth-child(6){width:38%}
#businesses-tbody td:nth-child(5){font-size:.78rem;line-height:1.45}
#businesses-tbody [data-usage-business]{order:-1}
@media(max-width:600px){.metrics-grid{grid-template-columns:repeat(2,1fr);gap:8px}.metric-card{padding:12px 8px}.metric-num{font-size:1.45rem}.section>summary{padding:14px}.section-body{padding:10px}.rep-form-container input{margin:0!important}.container{padding-left:10px!important;padding-right:10px!important}.action-btn{font-size:.7rem;padding:6px 8px}.search-toolbar{grid-template-columns:1fr 1fr}.search-toolbar .search-wrap{grid-column:1/-1}.data-table-wrap{display:none!important}.mobile-cards{display:block}.detail-grid{grid-template-columns:1fr 1fr}.page-btn{padding:7px 9px}}
</style></head><body><div class="container" style="max-width:950px;text-align:left"><h2>Super Admin</h2><p class="subtitle" id="auth-status">Authenticating...</p><div id="admin-content" class="hidden">
<details class="section"><summary>👥 Sales Reps</summary><div class="section-body"><div style="background:#f8fafc;padding:16px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:18px"><h4 style="margin-top:0;margin-bottom:10px">Create New Sales Rep</h4><div class="rep-form-container"><input type="text" id="new-rep-name" class="form-input" placeholder="Sales Rep Name" style="margin:0"><input type="tel" id="new-rep-mobile" class="form-input" placeholder="Mobile Number" style="margin:0"><input type="email" id="new-rep-email" class="form-input" placeholder="Email" style="margin:0"><button type="button" id="create-rep-btn" class="action-btn btn-copy" style="padding:10px 16px;font-size:.9rem">Generate Token</button></div></div><div class="search-toolbar"><div class="search-wrap"><input id="rep-search" class="smart-search" autocomplete="off" placeholder="🔍 Search name, phone, email or rep code..."><div id="rep-suggestions" class="suggestions"></div></div><select id="rep-status-filter" class="toolbar-select"><option value="all">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select><select id="rep-sort" class="toolbar-select"><option value="newest">Newest</option><option value="name">Name A–Z</option><option value="businesses">Businesses</option></select></div><div id="rep-result-meta" class="result-meta"></div><div class="data-table-wrap" style="overflow-x:auto"><table class="data-table"><thead><tr><th>Rep Name</th><th>Mobile</th><th>Email</th><th>Status</th><th>Token</th><th>Actions</th></tr></thead><tbody id="reps-tbody"></tbody></table></div><div id="reps-mobile-cards" class="mobile-cards"></div><div id="rep-pagination" class="pagination"></div></div></details>
<details class="section" open><summary>🏢 Businesses</summary><div class="section-body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px"><h3 style="margin:0">Businesses</h3><button type="button" id="open-add-modal-btn" class="action-btn btn-add">➕ Add Business</button></div><div class="search-toolbar"><div class="search-wrap"><input id="business-search" class="smart-search" autocomplete="off" placeholder="🔍 Search business, owner, phone, email, QR, rep..."><div id="business-suggestions" class="suggestions"></div></div><select id="business-status-filter" class="toolbar-select"><option value="all">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select><select id="business-rep-filter" class="toolbar-select"><option value="all">All Sales Reps</option></select></div><div class="search-toolbar" style="grid-template-columns:minmax(0,1fr) 150px;margin-bottom:4px"><div></div><select id="business-sort" class="toolbar-select"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="name">Name A–Z</option><option value="feedback">Private Feedback</option></select></div><div id="business-result-meta" class="result-meta"></div><div class="data-table-wrap" style="overflow-x:auto"><table class="data-table"><thead><tr><th>Business</th><th>Owner</th><th>QR Code</th><th>Sales Rep</th><th>Review Stats</th><th>Actions</th></tr></thead><tbody id="businesses-tbody"></tbody></table></div><div id="business-mobile-cards" class="mobile-cards"></div><div id="business-pagination" class="pagination"></div></div></details></div></div>
<div id="add-modal" class="modal-overlay hidden"><div class="modal-card"><h3 style="margin-top:0">Onboard New Business</h3><form id="add-biz-form"><label class="form-label">Standee Code *</label><input type="text" id="add-qr-code" class="form-input" required><label class="form-label">Business Name *</label><input type="text" id="add-biz-name" class="form-input" required><label class="form-label">Google Review Link *</label><input type="url" id="add-google-url" class="form-input" value="http://search.google.com/local/writereview?placeid=" required><label class="form-label">Owner / Manager Name *</label><input type="text" id="add-owner-name" class="form-input" required><label class="form-label">Assign Sales Rep (Optional)</label><select id="add-rep-select" class="form-input"><option value="">Direct Admin (No Rep)</option></select><label class="form-label">WhatsApp Number</label><input type="tel" id="add-whatsapp" class="form-input"><label class="form-label">Phone Number</label><input type="tel" id="add-phone" class="form-input"><label class="form-label">Instagram Profile URL</label><input type="url" id="add-instagram-url" class="form-input"><label class="form-label">YouTube Channel URL</label><input type="url" id="add-youtube-url" class="form-input"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" id="close-add-modal-btn" class="action-btn btn-cancel">Cancel</button><button type="submit" class="action-btn btn-add">Onboard Business</button></div></form></div></div>
<div id="edit-rep-modal" class="modal-overlay hidden"><div class="modal-card"><h3 style="margin-top:0">Edit Sales Rep</h3><form id="edit-rep-form"><input type="hidden" id="edit-rep-id"><label class="form-label">Sales Rep Name</label><input type="text" id="edit-rep-name" class="form-input" required><label class="form-label">Mobile Number</label><input type="tel" id="edit-rep-mobile" class="form-input"><label class="form-label">Email</label><input type="email" id="edit-rep-email" class="form-input"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" id="close-edit-rep-modal-btn" class="action-btn btn-cancel">Cancel</button><button type="submit" class="action-btn btn-edit">Save Changes</button></div></form></div></div>
<div id="edit-modal" class="modal-overlay hidden"><div class="modal-card"><h3 style="margin-top:0">Edit Business</h3><form id="edit-biz-form"><input type="hidden" id="edit-biz-id"><label class="form-label">Business Name</label><input type="text" id="edit-biz-name" class="form-input" required><label class="form-label">Owner Name</label><input type="text" id="edit-owner-name" class="form-input" required><label class="form-label">Google Review URL</label><input type="url" id="edit-google-url" class="form-input" required><label class="form-label">WhatsApp Number</label><input type="tel" id="edit-whatsapp" class="form-input"><label class="form-label">Phone Number</label><input type="tel" id="edit-phone" class="form-input"><label class="form-label">Instagram Profile URL</label><input type="url" id="edit-instagram-url" class="form-input"><label class="form-label">YouTube Channel URL</label><input type="url" id="edit-youtube-url" class="form-input"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" id="close-edit-modal-btn" class="action-btn btn-cancel">Cancel</button><button type="submit" class="action-btn btn-edit">Save Changes</button></div></form></div></div>
<div id="qr-modal" class="modal-overlay hidden"><div class="modal-card" style="text-align:center;max-width:320px"><h3 style="margin-top:0" id="qr-modal-title">QR Code Preview</h3><div id="qr-canvas-container" style="margin:20px auto;display:flex;justify-content:center"></div><p id="qr-modal-url" style="font-size:.72rem;color:#6b7280;word-break:break-all;margin-bottom:16px"></p><div style="display:flex;gap:8px;justify-content:center"><button type="button" id="close-qr-modal-btn" class="action-btn btn-cancel">Close</button><a id="download-qr-btn" download="qr-code.png" class="action-btn btn-add">Download PNG</a></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script type="module" src="js/superadmin.js?v=20"></script></body></html>
