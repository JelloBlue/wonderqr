<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WonderQR - Review Filter Control</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}.wrap{max-width:1050px;margin:auto;padding:18px 12px}.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.08)}h1{font-size:1.3rem;color:#0d4734}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:.82rem;vertical-align:middle}th{background:#f8fafc}.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.btn{border:0;border-radius:7px;padding:8px 10px;font-weight:700;cursor:pointer}.on{background:#0d4734;color:#fff}.off{background:#e5e7eb;color:#374151}.lock{background:#f59e0b;color:#fff}.status{font-weight:700}.small{font-size:.72rem;color:#6b7280;margin-top:3px}@media(max-width:700px){table,thead,tbody,th,td,tr{display:block}thead{display:none}tr{border:1px solid #e5e7eb;border-radius:10px;margin-bottom:9px;padding:8px}td{border:0;padding:5px}td:before{content:attr(data-label);font-weight:700;display:inline-block;width:105px;color:#64748b}.controls{margin-left:105px}}</style></head><body><main class="wrap"><h1>⭐ WonderQR — Super Admin Review Filter Control</h1><div id="status" class="card">Authenticating...</div><div class="card"><div class="small">Default for all businesses: <strong>Filter ON · 4 & 5 stars to Google</strong></div></div><div class="card"><table><thead><tr><th>Business</th><th>Filter</th><th>Google Ratings</th><th>Lock</th><th>Save</th></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module">import { SUPABASE_URL } from './js/config.js';const key=new URLSearchParams(location.search).get('key')||'';const $=id=>document.getElementById(id);async function api(action,extra={}){const r=await fetch(`${SUPABASE_URL}/functions/v1/superadmin_api`,{method:'POST',headers:{'Content-Type':'application/json','apikey':(await import('./js/config.js')).SUPABASE_ANON_KEY,'x-superadmin-key':key},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const d=await api('dashboard');$('status').textContent=`Loaded ${d.businesses.length} businesses.`;render(d.businesses)}catch(e){$('status').textContent=e.message;$('status').style.color='#b91c1c'}}function render(list){$('rows').innerHTML=list.map(b=>{const enabled=b.review_filter_enabled!==false,min=[4,5].includes(Number(b.review_min_rating))?Number(b.review_min_rating):4,locked=b.review_filter_locked===true;return `<tr data-id="${b.id}"><td data-label="Business"><strong>${esc(b.business_name)}</strong><div class="small">BID ${esc(b.id)}</div></td><td data-label="Filter"><button class="btn ${enabled?'on':'off'}" data-enabled="${enabled}">${enabled?'ON':'OFF'}</button></td><td data-label="Google Ratings"><select class="min-rating" ${locked?'disabled':''}><option value="4" ${min===4?'selected':''}>4 & 5 stars</option><option value="5" ${min===5?'selected':''}>5 stars only</option></select></td><td data-label="Lock"><button class="btn ${locked?'lock':'off'}" data-lock="${locked}">${locked?'🔒 Locked':'🔓 Unlocked'}</button></td><td data-label="Save"><button class="btn on" data-save>Save</button></td></tr>`}).join('');document.querySelectorAll('[data-enabled]').forEach(btn=>btn.onclick=()=>{btn.dataset.enabled=btn.dataset.enabled==='true'?'false':'true';btn.textContent=btn.dataset.enabled==='true'?'ON':'OFF';btn.className=`btn ${btn.dataset.enabled==='true'?'on':'off'}`});document.querySelectorAll('[data-lock]').forEach(btn=>btn.onclick=()=>{btn.dataset.lock=btn.dataset.lock==='true'?'false':'true';btn.textContent=btn.dataset.lock==='true'?'🔒 Locked':'🔓 Unlocked';btn.className=`btn ${btn.dataset.lock==='true'?'lock':'off'}`;const row=btn.closest('tr');row.querySelector('.min-rating').disabled=btn.dataset.lock==='true'});document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=async()=>{const row=btn.closest('tr'),id=Number(row.dataset.id),enabled=row.querySelector('[data-enabled]').dataset.enabled==='true',min=Number(row.querySelector('.min-rating').value),locked=row.querySelector('[data-lock]').dataset.lock==='true';btn.disabled=true;try{await api('update_review_settings',{business_id:id,review_filter_enabled:enabled,review_min_rating:min,review_filter_locked:locked});btn.textContent='Saved';setTimeout(()=>{btn.textContent='Save';btn.disabled=false},700)}catch(e){alert(e.message);btn.disabled=false}})}load();</script></body></html>
