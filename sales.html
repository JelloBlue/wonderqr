<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Onboarding - WonderQR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 480px;">
    <h2>Onboard New Business</h2>
    <p class="subtitle" id="rep-name-display">Verifying Access Token...</p>

    <form id="onboard-form" class="hidden" style="text-align: left;">
      <label class="form-label">Standee Code *</label>
      <input type="text" id="qr-code-input" class="form-input" placeholder="e.g. RS00001" required>

      <label class="form-label">Business Name *</label>
      <input type="text" id="biz-name-input" class="form-input" placeholder="e.g. Varsha Grand" required>

      <label class="form-label">Google Review Link *</label>
      <input type="url" id="google-url-input" class="form-input" value="http://search.google.com/local/writereview?placeid=" required>

      <div style="margin-top: 4px; margin-bottom: 12px;">
        <a href="https://developers.google.com/maps/documentation/javascript/examples/places-placeid-finder" 
           target="_blank" 
           rel="noopener noreferrer" 
           style="display: inline-block; padding: 4px 10px; font-size: 0.8rem; background-color: #f3f4f6; color: #4f46e5; border: 1px solid #d1d5db; border-radius: 4px; text-decoration: none; font-weight: 600;">
          🔍 Find Place ID (Opens in new tab)
        </a>
      </div>

      <label class="form-label">WhatsApp Number (with country code)</label>
      <input type="tel" id="whatsapp-input" class="form-input" placeholder="e.g. 919876543210">

      <label class="form-label">Phone Number for Direct Calls</label>
      <input type="tel" id="phone-input" class="form-input" placeholder="e.g. +919876543210">

      <label class="form-label">Instagram Profile Link</label>
      <input type="url" id="instagram-input" class="form-input" placeholder="https://instagram.com/profile">

      <label class="form-label">YouTube Channel Link</label>
      <input type="url" id="youtube-input" class="form-input" placeholder="https://youtube.com/@channel">

      <label class="form-label">Owner / Manager Name *</label>
      <input type="text" id="owner-name-input" class="form-input" placeholder="e.g. Ravi" required>

      <button type="submit" style="margin-top: 1rem;">Activate Standee Now</button>
    </form>

    <div id="success-screen" class="hidden">
      <h3 style="color: #16a34a; margin-bottom: 16px;">🎉 Onboarding Complete!</h3>

      <div style="margin-bottom: 20px; text-align: left;">
        <label class="form-label" style="font-weight: 600;">1. Customer QR / Review Link</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="text" id="customer-link-output" class="form-input" readonly style="flex: 1;">
          <button type="button" onclick="shareLink('customer-link-output', 'Customer Review Link')" style="padding: 8px 14px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
            📤 Share
          </button>
        </div>
      </div>

      <div style="margin-bottom: 20px; text-align: left;">
        <label class="form-label" style="font-weight: 600;">2. Business Owner Feedback Link</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="text" id="owner-link-output" class="form-input" readonly style="flex: 1;">
          <button type="button" onclick="shareLink('owner-link-output', 'Owner Dashboard Link')" style="padding: 8px 14px; background-color: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
            📤 Share
          </button>
        </div>
      </div>

      <button type="button" onclick="window.location.reload()" style="margin-top: 10px;">Onboard Another</button>
    </div>
  </div>

  <script style="display:none;">
    window.shareLink = async function(inputId, title) {
      const url = document.getElementById(inputId).value;
      if (navigator.share) {
        try {
          await navigator.share({
            title: title,
            url: url
          });
        } catch (err) {
          // User cancelled
        }
      } else {
        navigator.clipboard.writeText(url);
        alert('Link copied to clipboard!');
      }
    };
  </script>

  <script type="module" src="js/sales.js"></script>
</body>
</html>
