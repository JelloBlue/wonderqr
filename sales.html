<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sales Onboarding - WonderQR</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="css/style.css"><style>body{background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:32px 16px;color:#1f2937}.card-container{max-width:540px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);padding:32px 28px;box-sizing:border-box}.page-title{font-size:1.6rem;font-weight:700;color:#111827;margin:0 0 4px;text-align:center}.agent-badge{font-size:.9rem;color:#6b7280;text-align:center;margin-bottom:24px}.form-group{margin-bottom:16px;text-align:left}.form-group label{display:block;margin-bottom:6px;font-size:.85rem;font-weight:600;color:#374151}.form-input-styled{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;outline:none}.form-input-styled:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}.submit-btn{width:100%;padding:12px;margin-top:12px;background:#4f46e5;color:#fff;border:0;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer}.pin-note{font-size:.78rem;color:#6b7280;margin-top:5px}.success-badge{text-align:center;color:#16a34a;font-size:1.25rem;font-weight:700;margin:0 0 20px}.link-section{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:16px}.link-title{font-weight:600;font-size:.85rem;color:#4b5563;margin:0 0 8px}.link-input-row{display:flex;gap:8px;margin-bottom:8px}.link-input-row input{flex:1;background:#fff;color:#374151;font-family:monospace;font-size:.82rem}.btn-group{display:flex;gap:8px;flex-wrap:wrap}.action-btn{flex:1;padding:9px 12px;font-size:.8rem;border:0;border-radius:6px;cursor:pointer;font-weight:600;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;box-sizing:border-box;white-space:nowrap}.btn-copy{background:#4f46e5;color:#fff}.btn-qr{background:#8b5cf6;color:#fff}.btn-share{background:#25d366;color:#fff}.btn-cancel{background:#6b7280;color:#fff}.btn-add{background:#16a34a;color:#fff}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}.modal-card{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:320px;box-sizing:border-box;text-align:center}.hidden{display:none!important}.social-heading{margin:22px 0 10px;font-size:.9rem;font-weight:800;color:#374151;padding-top:14px;border-top:1px solid #e5e7eb}</style></head>
<body><div class="card-container"><h2 class="page-title">Onboard New Business</h2><div id="agent-info" class="agent-badge">Authenticating Sales Agent...</div><form id="onboard-form">
<div class="form-group"><label>Standee Code (QR ID) *</label><input type="text" id="qr-code" class="form-input-styled" placeholder="e.g. RS00001" required></div>
<div class="form-group"><label>Business Name *</label><input type="text" id="biz-name" class="form-input-styled" placeholder="e.g. Varsha Grand" required></div>
<div class="form-group"><label>Google Review Link *</label><input type="url" id="google-url" class="form-input-styled" value="http://search.google.com/local/writereview?placeid=" required></div>
<div class="form-group"><label>Owner / Manager Name *</label><input type="text" id="owner-name" class="form-input-styled" placeholder="e.g. Ravi" required></div>
<div class="form-group"><label>Business Admin PIN * (create now)</label><input type="password" id="admin-pin" class="form-input-styled" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4 digits" required><div class="pin-note">This PIN is created for the business owner. You will not be able to view or reset it later.</div></div>
<div class="form-group"><label>Confirm Admin PIN *</label><input type="password" id="admin-pin-confirm" class="form-input-styled" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="Repeat 4 digits" required></div>
<div class="form-group"><label>Instagram Profile URL (Optional)</label><input type="url" id="instagram-url" class="form-input-styled" placeholder="https://instagram.com/..."></div>
<div class="form-group"><label>YouTube Channel URL (Optional)</label><input type="url" id="youtube-url" class="form-input-styled" placeholder="https://youtube.com/..."></div>
<div class="social-heading">Other Social & Contact Links</div>
<div class="form-group"><label>Facebook Page URL (Optional)</label><input type="url" id="facebook-url" class="form-input-styled" placeholder="https://facebook.com/..."></div>
<div class="form-group"><label>WhatsApp Number (Optional)</label><input type="tel" id="whatsapp" class="form-input-styled" placeholder="e.g. 919876543210"></div>
<div class="form-group"><label>Phone Number (Optional)</label><input type="tel" id="phone" class="form-input-styled" placeholder="e.g. +919876543210"></div>
<div class="form-group"><label>Justdial URL (Optional)</label><input type="url" id="justdial-url" class="form-input-styled" placeholder="https://justdial.com/..."></div>
<div class="form-group"><label>Zomato URL (Optional)</label><input type="url" id="zomato-url" class="form-input-styled" placeholder="https://zomato.com/..."></div>
<div class="form-group"><label>Swiggy URL (Optional)</label><input type="url" id="swiggy-url" class="form-input-styled" placeholder="https://swiggy.com/..."></div>
<div class="form-group"><label>Pinterest Profile URL (Optional)</label><input type="url" id="pinterest-url" class="form-input-styled" placeholder="https://pinterest.com/..."></div>
<div class="form-group"><label>X (Twitter) Profile URL (Optional)</label><input type="url" id="x-url" class="form-input-styled" placeholder="https://x.com/..."></div>
<button type="submit" class="submit-btn">Complete Onboarding</button></form>
<div id="success-container" class="hidden"><div class="success-badge">🎉 Onboarding Complete!</div><div class="link-section"><div class="link-title">1. Customer QR / Review Link</div><div class="link-input-row"><input type="text" id="created-customer-url" class="form-input-styled" readonly></div><div class="btn-group"><button type="button" class="action-btn btn-copy" onclick="copyCustomerUrl()">Copy</button><button type="button" class="action-btn btn-qr" onclick="generateCustomerQr()">Generate QR</button><button type="button" class="action-btn btn-share" onclick="shareCustomerUrl()">Share</button></div></div><div class="link-section"><div class="link-title">2. Business Owner Dashboard Link</div><div class="link-input-row"><input type="text" id="created-owner-url" class="form-input-styled" readonly></div><div class="btn-group"><button type="button" class="action-btn btn-copy" onclick="copyOwnerUrl()">Copy</button><button type="button" class="action-btn btn-share" onclick="shareOwnerUrl()">Share</button></div></div><button type="button" id="onboard-another-btn" class="submit-btn" style="background:#374151">Onboard Another Business</button></div></div>
<div id="qr-modal" class="modal-overlay hidden"><div class="modal-card"><h3 style="margin-top:0" id="qr-modal-title">QR Code Preview</h3><div id="qr-canvas-container" style="margin:16px auto;display:flex;justify-content:center"></div><p id="qr-modal-url" style="font-size:.72rem;color:#6b7280;word-break:break-all;margin-bottom:16px"></p><div style="display:flex;gap:8px;justify-content:center"><button type="button" id="close-qr-modal-btn" class="action-btn btn-cancel">Close</button><a id="download-qr-btn" download="customer-qr.png" class="action-btn btn-add">Download PNG</a></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script type="module" src="js/sales.js?v=7"></script></body></html>
