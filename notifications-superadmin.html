<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WonderQR Notifications</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#1f2937}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 5px 18px #0001}.row{display:grid;gap:8px;margin-bottom:12px}label{font-weight:700;font-size:.85rem}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#0d4734;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#374151}.btn:disabled{background:#9ca3af;cursor:not-allowed}.status{margin-top:12px;padding:10px;border-radius:8px;background:#f8fafc;white-space:pre-wrap}.muted{font-size:.78rem;color:#6b7280}.hidden{display:none}.result{margin-top:10px;padding:10px;border-radius:8px;background:#f9fafb;border:1px solid #e5e7eb;font-size:.8rem;line-height:1.45}.ok{color:#047857}.fail{color:#b91c1c}.auth-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:14px}.auth-actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="card"><h2>🔔 WonderQR Notifications</h2><p class="muted">Super Admin notification console.</p><div class="auth-box"><div class="row" style="margin-bottom:8px"><label for="superadmin-key">Super Admin access key</label><input id="superadmin-key" type="password" autocomplete="current-password" placeholder="Enter Super Admin access key"></div><div class="auth-actions"><button id="unlock" class="btn" type="button">Unlock</button><button id="clear-key" class="btn secondary" type="button">Clear Saved Key</button></div><div id="auth-status" class="muted" style="margin-top:8px">The key is kept only in this browser session and is not placed in the URL.</div></div><div id="console" class="hidden"><div class="row"><label>Target</label><select id="target"><option value="all">All subscribed business admins</option><option value="business">Specific business</option></select></div><div class="row" id="business-row"><label>Business ID or WonderQR Code</label><input id="business-id" placeholder="e.g. 7 or RS00001"></div><div class="row"><label>Title</label><input id="title" maxlength="120" placeholder="Notification title"></div><div class="row"><label>Message</label><textarea id="message" maxlength="1000" placeholder="Write your notification..."></textarea></div><div class="row"><label>Action URL (optional)</label><input id="action-url" maxlength="500" placeholder="/admin.html"></div><button id="send" class="btn">Send Notification</button><div id="status" class="status">Ready.</div><div id="results"></div></div></div></main><script type="module">import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./js/config.js';const KEY_STORAGE='wonderqr_superadmin_session_key';const $=id=>document.getElementById(id);let key=sessionStorage.getItem(KEY_STORAGE)||'';$('superadmin-key').value=key?'••••••••••••':'';function setAuthStatus(text,ok=false){$('auth-status').textContent=text;$('auth-status').style.color=ok?'#047857':''}function showConsole(){ $('console').classList.remove('hidden'); }function hideConsole(){ $('console').classList.add('hidden'); }async function validateKey(candidate){const r=await fetch(`${SUPABASE_URL}/functions/v1/send-admin-notification`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'x-superadmin-key':candidate},body:JSON.stringify({target_type:'business',business_id:'__invalid__',title:'auth-check',message:'auth-check',action_url:'/admin.html'})});return r.status!==401;}async function unlock(){const input=$('superadmin-key');const candidate=input.value==='••••••••••••'?key:input.value.trim();if(!candidate)return setAuthStatus('Enter the Super Admin access key.');const b=$('unlock');b.disabled=true;setAuthStatus('Checking access...');try{const valid=await validateKey(candidate);if(!valid){key='';sessionStorage.removeItem(KEY_STORAGE);hideConsole();input.value='';return setAuthStatus('Access denied. The key was not accepted.');}key=candidate;sessionStorage.setItem(KEY_STORAGE,key);input.value='••••••••••••';showConsole();setAuthStatus('Access verified for this browser session.',true);}catch(e){setAuthStatus('Unable to verify access. Please try again.');}finally{b.disabled=false}}$('unlock').addEventListener('click',unlock);$('superadmin-key').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('clear-key').addEventListener('click',()=>{key='';sessionStorage.removeItem(KEY_STORAGE);$('superadmin-key').value='';hideConsole();setAuthStatus('Saved key cleared from this browser session.');});$('target').addEventListener('change',()=>$('business-row').classList.toggle('hidden',$('target').value!=='business'));$('business-row').classList.add('hidden');$('send').addEventListener('click',async()=>{const target_type=$('target').value,business_id=$('business-id').value.trim(),title=$('title').value.trim(),message=$('message').value.trim(),action_url=$('action-url').value.trim()||'/admin.html';if(!key)return setAuthStatus('Unlock the notification console first.');if(!title||!message)return $('status').textContent='Title and message are required.';if(target_type==='business'&&!business_id)return $('status').textContent='Enter a Business ID or WonderQR Code.';const btn=$('send');btn.disabled=true;$('results').innerHTML='';$('status').textContent='Sending...';try{const r=await fetch(`${SUPABASE_URL}/functions/v1/send-admin-notification`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'x-superadmin-key':key},body:JSON.stringify({target_type,business_id,title,message,action_url})});const d=await r.json().catch(()=>({}));if(r.status===401){key='';sessionStorage.removeItem(KEY_STORAGE);hideConsole();$('superadmin-key').value='';setAuthStatus('Access expired or denied. Unlock again.');throw new Error('Access denied');}if(!r.ok)throw new Error(d.error||'Send failed');$('status').textContent=`Push provider accepted: ${d.sent||0} of ${d.eligible||0}. Failed: ${d.failed||0}.`;(d.results||[]).forEach((x,i)=>{const div=document.createElement('div');div.className='result '+(x.ok?'ok':'fail');div.textContent=x.ok?`Device ${i+1}: provider accepted (${x.statusCode||'status unavailable'}) — ${x.user_agent||'Unknown browser'}`:`Device ${i+1}: FAILED (${x.statusCode||'no status'}) — ${x.name||'PushDeliveryError'} — ${x.message||'Unknown error'}${x.providerBody?' — Provider: '+x.providerBody:''} — ${x.user_agent||'Unknown browser'}`;$('results').appendChild(div)});$('message').value='';}catch(e){$('status').textContent='Error: '+e.message}finally{btn.disabled=false}});if(key){showConsole();setAuthStatus('Session key restored for this browser session.',true);}</script></body></html>
