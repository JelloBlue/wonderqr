<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WonderQR Notifications</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#1f2937}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 5px 18px #0001}.row{display:grid;gap:8px;margin-bottom:12px}label{font-weight:700;font-size:.85rem}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#0d4734;color:#fff;font-weight:700;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:8px;background:#f8fafc;white-space:pre-wrap}.muted{font-size:.78rem;color:#6b7280}.hidden{display:none}</style></head><body><main class="wrap"><div class="card"><h2>🔔 WonderQR Notifications</h2><p class="muted">Super Admin notification console.</p><div class="row"><label>Target</label><select id="target"><option value="all">All subscribed business admins</option><option value="business">Specific business</option></select></div><div class="row" id="business-row"><label>Business ID or WonderQR Code</label><input id="business-id" placeholder="e.g. 7 or RS00001"></div><div class="row"><label>Title</label><input id="title" maxlength="120" placeholder="Notification title"></div><div class="row"><label>Message</label><textarea id="message" maxlength="1000" placeholder="Write your notification..."></textarea></div><div class="row"><label>Action URL (optional)</label><input id="action-url" maxlength="500" placeholder="/admin.html"></div><button id="send" class="btn">Send Notification</button><div id="status" class="status">Ready.</div></div></main><script type="module">import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./js/config.js';const key=new URLSearchParams(location.search).get('key')||'';const $=id=>document.getElementById(id);$('target').addEventListener('change',()=>$('business-row').classList.toggle('hidden',$('target').value!=='business'));$('business-row').classList.add('hidden');$('send').addEventListener('click',async()=>{const target_type=$('target').value,business_id=$('business-id').value.trim(),title=$('title').value.trim(),message=$('message').value.trim(),action_url=$('action-url').value.trim()||'/admin.html';if(!title||!message)return $('status').textContent='Title and message are required.';if(target_type==='business'&&!business_id)return $('status').textContent='Enter a Business ID or WonderQR Code.';const btn=$('send');btn.disabled=true;$('status').textContent='Sending...';try{const r=await fetch(`${SUPABASE_URL}/functions/v1/send-admin-notification`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'x-superadmin-key':key},body:JSON.stringify({target_type,business_id,title,message,action_url})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Send failed');$('status').textContent=`Sent: ${d.sent||0} of ${d.eligible||0} eligible subscriptions. Failed: ${d.failed||0}.`;$('message').value='';}catch(e){$('status').textContent='Error: '+e.message}finally{btn.disabled=false}});</script></body></html>
